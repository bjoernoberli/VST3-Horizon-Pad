name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds with Ninja (installed via Homebrew, already on the
          # runner - no marketplace action needed). Universal binary
          # (arm64 + x86_64) is CMakeLists.txt's default.
          - name: macOS
            os: macos-14
            generator: Ninja
            generator_args: ""
            vst3_path: build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3
          # Windows uses CMake's native Visual Studio generator instead of
          # Ninja. MSBuild locates the MSVC toolchain itself, so there is no
          # need to put cl.exe on PATH (no Developer Command Prompt / vcvars
          # setup step required at all).
          - name: Windows
            os: windows-2022
            generator: "Visual Studio 17 2022"
            generator_args: "-A x64"
            vst3_path: build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # JUCE is pulled in by FetchContent. Cache the whole _deps tree so repeat
      # runs do not re-clone it.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          # Keyed by generator, not just OS: a cached build/_deps tree
          # (including JUCE's FetchContent subbuild, which has its own
          # CMakeCache.txt) is tied to whatever generator configured it.
          # Restoring an old Ninja-configured cache under a Visual Studio
          # config (or vice versa) makes CMake hard-fail with "Does not
          # match the generator used previously" - scoping the key avoids
          # that collision entirely.
          key: ${{ runner.os }}-${{ matrix.generator }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.generator }}-fetchcontent-

      - name: Configure
        run: cmake -B build -G "${{ matrix.generator }}" ${{ matrix.generator_args }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build VST3
        run: cmake --build build --target HorizonPad_VST3 --config ${{ env.BUILD_TYPE }}

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-VST3-${{ matrix.name }}
          path: ${{ matrix.vst3_path }}
          if-no-files-found: error

  package-macos:
    name: Package macOS installer (.pkg)
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # download-artifact restores an uploaded directory's CONTENTS at
      # the given path (the original directory name is not part of the
      # artifact) - so the download path itself must be the bundle name we
      # want reconstructed.
      - name: Download macOS VST3
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-VST3-macOS
          path: "dist/vst3/Horizon Pad.vst3"

      # Unsigned/unnotarized (see README - no Apple Developer ID on this
      # project). End users will need to right-click > Open the first time.
      - name: Build .pkg
        run: |
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh "dist/vst3/Horizon Pad.vst3" dist/pkg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-macOS-Installer
          path: dist/pkg/Horizon Pad.pkg
          if-no-files-found: error

  package-windows:
    name: Package Windows installer (.bat)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows VST3
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-VST3-Windows
          path: dist/installer/Horizon Pad.vst3

      - name: Assemble installer folder
        run: cp packaging/windows/*.bat "dist/installer/"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-Windows-Installer
          path: dist/installer
          if-no-files-found: error

  package-release:
    name: Combine cross-platform release
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-macOS-Installer
          path: release/macOS

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-Windows-Installer
          path: release/Windows

      - name: Zip combined release
        run: |
          cd release
          zip -r ../HorizonPad-CrossPlatform-Release.zip macOS Windows

      - name: Upload combined release
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-CrossPlatform-Release
          path: HorizonPad-CrossPlatform-Release.zip
          if-no-files-found: error

  validate:
    name: Steinberg VST3 validator
    needs: build
    runs-on: macos-14
    # Deliberately non-blocking for the initial CI rollout. Once the validator
    # is green and stable, drop this line to promote it to a hard gate.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: macOS-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macOS-fetchcontent-

      - name: Build the plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build --target HorizonPad_VST3

      # Build the validator from the VST3 SDK. Only the four submodules the
      # validator actually needs are initialised, and the plugin examples and
      # VSTGUI are switched off, which keeps this well under a couple of minutes.
      - name: Build Steinberg validator
        run: |
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 -- base cmake pluginterfaces public.sdk
          cd ..
          cmake -B vst3sdk-build -S vst3sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk-build --target validator

      - name: Run validator against Horizon Pad.vst3
        run: |
          VALIDATOR="$(find vst3sdk-build -type f -name validator -perm -111 | head -n 1)"
          echo "Using validator: $VALIDATOR"
          "$VALIDATOR" "build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3"
