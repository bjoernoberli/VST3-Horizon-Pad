name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds with Ninja (installed via Homebrew, already on the
          # runner - no marketplace action needed). Universal binary
          # (arm64 + x86_64) is CMakeLists.txt's default.
          - name: macOS
            os: macos-14
            generator: Ninja
            generator_args: ""
            vst3_path: build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3
          # Windows uses CMake's native Visual Studio generator instead of
          # Ninja. MSBuild locates the MSVC toolchain itself, so there is no
          # need to put cl.exe on PATH (no Developer Command Prompt / vcvars
          # setup step required at all).
          - name: Windows
            os: windows-2022
            generator: "Visual Studio 17 2022"
            generator_args: "-A x64"
            vst3_path: build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # JUCE is pulled in by FetchContent. Cache the whole _deps tree so repeat
      # runs do not re-clone it.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          # Keyed by generator, not just OS: a cached build/_deps tree
          # (including JUCE's FetchContent subbuild, which has its own
          # CMakeCache.txt) is tied to whatever generator configured it.
          # Restoring an old Ninja-configured cache under a Visual Studio
          # config (or vice versa) makes CMake hard-fail with "Does not
          # match the generator used previously" - scoping the key avoids
          # that collision entirely.
          key: ${{ runner.os }}-${{ matrix.generator }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.generator }}-fetchcontent-

      - name: Configure
        run: cmake -B build -G "${{ matrix.generator }}" ${{ matrix.generator_args }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build VST3
        run: cmake --build build --target HorizonPad_VST3 --config ${{ env.BUILD_TYPE }}

      # Fail loudly here rather than silently shipping a broken bundle: end
      # users hitting "a sealed resource is missing or invalid" when a DAW
      # scans the plugin almost always traces back to either a missing
      # executable inside Contents/MacOS, or an ad-hoc code signature that
      # went stale after the bundle was copied/repackaged since it was
      # built (this project has no Developer ID, so everything is ad-hoc
      # signed). Re-sign right after building, before this bundle goes
      # anywhere near the artifact zip round-trip.
      - name: Verify and re-sign macOS bundle
        if: runner.os == 'macOS'
        run: |
          BUNDLE="${{ matrix.vst3_path }}"
          BINARY="$(find "$BUNDLE/Contents/MacOS" -type f | head -n 1)"
          if [ -z "$BINARY" ] || [ ! -s "$BINARY" ]; then
            echo "ERROR: no (or empty) executable found under $BUNDLE/Contents/MacOS" >&2
            ls -laR "$BUNDLE"
            exit 1
          fi
          echo "Found binary: $BINARY ($(stat -f%z "$BINARY") bytes)"
          file "$BINARY"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE" && echo "codesign verify OK"

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-VST3-${{ matrix.name }}
          path: ${{ matrix.vst3_path }}
          if-no-files-found: error

  package-macos:
    name: Package macOS installer (.pkg)
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # download-artifact restores an uploaded directory's CONTENTS at
      # the given path (the original directory name is not part of the
      # artifact) - so the download path itself must be the bundle name we
      # want reconstructed.
      - name: Download macOS VST3
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-VST3-macOS
          path: "dist/vst3/Horizon Pad.vst3"

      # The artifact zip round-trip can leave an ad-hoc signature stale even
      # when every file byte survived (permission-bit/ordering differences
      # are enough to invalidate codesign's sealed resource envelope) - and
      # if the executable itself failed to come through, better to fail here
      # with a clear message than ship a bundle with an empty Contents/MacOS.
      - name: Verify and re-sign downloaded bundle
        run: |
          BUNDLE="dist/vst3/Horizon Pad.vst3"
          BINARY="$(find "$BUNDLE/Contents/MacOS" -type f | head -n 1)"
          if [ -z "$BINARY" ] || [ ! -s "$BINARY" ]; then
            echo "ERROR: the downloaded artifact is missing its executable under $BUNDLE/Contents/MacOS - the upload/download round-trip dropped it." >&2
            ls -laR "$BUNDLE"
            exit 1
          fi
          echo "Found binary: $BINARY ($(stat -f%z "$BINARY") bytes)"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE" && echo "codesign verify OK"

      # Unsigned/unnotarized (see README - no Apple Developer ID on this
      # project). End users will hit a Gatekeeper warning the first time -
      # see packaging/macos/INSTALL-INSTRUCTIONS.txt, shipped alongside the
      # .pkg below, for the exact click-through steps (a plain .txt file
      # has no Gatekeeper warning of its own, so it's always readable).
      - name: Build .pkg
        run: |
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh "dist/vst3/Horizon Pad.vst3" dist/pkg
          cp packaging/macos/INSTALL-INSTRUCTIONS.txt dist/pkg/

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-macOS-Installer
          path: dist/pkg
          if-no-files-found: error

  package-windows:
    name: Package Windows installer (.bat)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows VST3
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-VST3-Windows
          path: dist/installer/Horizon Pad.vst3

      - name: Assemble installer folder
        run: cp packaging/windows/*.bat "dist/installer/"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-Windows-Installer
          path: dist/installer
          if-no-files-found: error

  package-release:
    name: Combine cross-platform release
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-macOS-Installer
          path: release/macOS

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: HorizonPad-Windows-Installer
          path: release/Windows

      # Upload the folder itself rather than a .zip we build by hand:
      # GitHub's browser download always wraps an artifact in its own zip,
      # so a pre-zipped artifact becomes a zip-of-a-zip - and since the
      # inner file shared the same name as the outer one, expanding it
      # tried to produce a file with the same name in the same folder,
      # which Archive Utility refused with "unsupported format". Uploading
      # the raw directory means GitHub's own wrapping is the only zip layer.
      - name: Upload combined release
        uses: actions/upload-artifact@v7
        with:
          name: HorizonPad-CrossPlatform-Release
          path: release
          if-no-files-found: error

  validate:
    name: Steinberg VST3 validator
    needs: build
    runs-on: macos-14
    # Promoted to a hard gate on 2026-09-24: the validator passes locally
    # (47 tests, 0 failed) and pluginval passes at strictness 10, so a failure
    # here is now a real regression rather than CI teething. Playbook G6.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: macOS-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macOS-fetchcontent-

      - name: Build the plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build --target HorizonPad_VST3

      # Build the validator from the VST3 SDK. Only the four submodules the
      # validator actually needs are initialised, and the plugin examples and
      # VSTGUI are switched off, which keeps this well under a couple of minutes.
      - name: Build Steinberg validator
        run: |
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 -- base cmake pluginterfaces public.sdk
          cd ..
          cmake -B vst3sdk-build -S vst3sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk-build --target validator

      - name: Run validator against Horizon Pad.vst3
        run: |
          VALIDATOR="$(find vst3sdk-build -type f -name validator -perm -111 | head -n 1)"
          echo "Using validator: $VALIDATOR"
          "$VALIDATOR" "build/HorizonPad_artefacts/Release/VST3/Horizon Pad.vst3"

  test:
    name: DSP test suite
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: macOS-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macOS-fetchcontent-

      - name: Install python dependencies
        run: python3 -m pip install --break-system-packages numpy scipy

      # The suite drives the real DSP through HorizonPadSoundTool, so the tool
      # is the only target it needs - not the VST3 bundle.
      - name: Build HorizonPadSoundTool
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build --target HorizonPadSoundTool

      - name: Run the test suite
        run: ctest --test-dir build --output-on-failure
